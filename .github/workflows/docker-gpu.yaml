name: Docker GPU Image

on:
  push:
    branches:
    - master
    tags:
    - v*
  # Limited to the paths that can break this image and are not covered by the
  # CPU image's PR build.
  pull_request:
    paths:
    - gpu.Dockerfile
    - .dockerignore
    - pixi.toml
    - pixi.lock
    - SuperBuild/**
    - scripts/docker-entrypoint.sh
    - scripts/smoke.py
    - .github/workflows/docker-gpu.yaml
  workflow_dispatch:

concurrency:
  group: docker-gpu-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    # A cold build accumulates ~31GB of build cache and a hosted runner keeps
    # only ~20GB free, so the preinstalled toolchains below have to go. Disk is
    # reported against the filesystem docker actually writes to.
    - name: Free disk space
      run: |
        docker_root="$(docker info -f '{{.DockerRootDir}}')"
        df -h "$docker_root"
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
        docker image prune -af
        echo "--- free after clearing preinstalled software"
        df -h "$docker_root"
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to DockerHub
      if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    # :edge-gpu on master; :<version>-gpu and :gpu on a v* tag.
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: opendronemap/odm
        flavor: |
          latest=false
          suffix=-gpu
        tags: |
          type=edge,branch=master
          type=semver,pattern={{version}}
          type=ref,event=pr
          type=raw,value=gpu,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    - name: Build and push Docker image
      id: docker_build
      uses: docker/build-push-action@v7
      with:
        file: ./gpu.Dockerfile
        target: runtime
        platforms: linux/amd64
        push: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ steps.meta.outputs.tags }}
    - name: Report disk
      if: always()
      run: df -h "$(docker info -f '{{.DockerRootDir}}')"
